<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>数学侦探：失落定理 — 终极版</title>
<style>
:root{--bg:#06080f;--panel:#0d1117;--card:#161b22;--gold:#f0c060;--gold2:#e09030;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--purple:#bc8cff;--cyan:#39d2c0;--text:#e6edf3;--text2:#8b949e;--border:#21262d;--accent:#6e40c9;--warn:#d2991b;--radius:12px;--radius-sm:6px;--font:'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;height:100vh;width:100vw;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;width:100%;height:100%}
canvas{display:block;position:absolute;top:0;left:0;z-index:1}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;pointer-events:none}
#ui-layer>*{pointer-events:auto}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(240,192,96,.3)}50%{box-shadow:0 0 20px rgba(240,192,96,.6)}}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}60%{transform:translateY(-4px)}}
@keyframes starPop{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(99,102,241,.4)}100%{box-shadow:0 0 0 20px rgba(99,102,241,0)}}
@keyframes rain{0%{transform:translateY(-10px);opacity:1}100%{transform:translateY(100vh);opacity:0}}
@keyframes cgFade{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes cgZoom{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes cgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes cgGlow{0%,100%{text-shadow:0 0 10px rgba(240,192,96,.4)}50%{text-shadow:0 0 30px rgba(240,192,96,.9),0 0 60px rgba(240,192,96,.4)}}
@keyframes typewriter{from{width:0}to{width:100%}}

.fade-in{animation:fadeIn .4s ease}.fade-up{animation:fadeUp .5s ease}.slide-in{animation:slideIn .4s ease}.pulse{animation:pulse 2s infinite}.bounce{animation:bounce .6s ease}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:600;transition:all .25s;font-family:var(--font);position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);filter:brightness(1.15)}.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--accent),#553098);color:#fff;box-shadow:0 4px 15px rgba(110,64,201,.3)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1a1a;box-shadow:0 4px 15px rgba(240,192,96,.3)}
.btn-outline{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn-sm{padding:6px 14px;font-size:12px}
#top-bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);z-index:20}
#top-bar .title{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:1px}
#top-bar .info{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--text2)}
.mastery-ring{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--panel);transition:border-color .5s}

/* Home */
#home-ui{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center}
#home-ui .hero{padding-top:44px;text-align:center;animation:fadeUp .6s ease}
#home-ui .hero h1{font-size:36px;background:linear-gradient(135deg,var(--gold),#e09030,#f0c060);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
#home-ui .hero .sub{color:var(--text2);font-size:13px;margin-bottom:16px}
#chapter-scroll{flex:1;overflow-y:auto;padding:8px 16px 100px;width:100%;max-width:860px}
#chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;justify-items:center}
.chapter-card{width:100%;max-width:190px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.chapter-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c-color,#444)}
.chapter-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(99,102,241,.2);border-color:var(--c-color,#6366f1)}
.chapter-card.completed{opacity:.9}.chapter-card.locked{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}.chapter-card.locked:hover{transform:none;box-shadow:none;border-color:var(--border)}
.chapter-card .c-icon{font-size:34px;margin-bottom:6px}.chapter-card .c-name{font-size:14px;font-weight:700}.chapter-card .c-desc{font-size:10px;color:var(--text2);line-height:1.3}
.chapter-card .c-stars{color:var(--gold);font-size:12px;margin-top:4px}.chapter-card .c-badge{position:absolute;top:6px;right:6px;font-size:10px;background:var(--accent);color:#fff;padding:1px 7px;border-radius:8px}
#home-ui .bottom-nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:20px;padding:12px;background:linear-gradient(0deg,var(--panel) 60%,transparent);z-index:15}
.nav-btn{text-align:center;cursor:pointer;color:var(--text2);font-size:11px;transition:all .2s;padding:5px 8px;border-radius:8px}.nav-btn:hover{color:var(--gold);background:rgba(240,192,96,.08)}
.nav-btn .nav-icon{font-size:20px;display:block;margin-bottom:1px}.nav-btn .nav-badge{font-size:9px;background:var(--red);color:#fff;padding:1px 5px;border-radius:6px;margin-left:3px}

/* Character portraits (CSS art) */
.portrait{display:inline-block;width:50px;height:50px;border-radius:50%;position:relative;flex-shrink:0;border:2px solid var(--border)}
.portrait.lg{width:80px;height:80px}.portrait.xl{width:100px;height:100px}
.portrait.p-main{background:linear-gradient(135deg,#1a3a5c,#2a6090);box-shadow:0 0 15px rgba(88,166,255,.3)}
.portrait.p-main::after{content:'🧑';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px}
.portrait.p-ouluo{background:linear-gradient(135deg,#3a3a3a,#6a6a6a);box-shadow:0 0 15px rgba(192,192,192,.3)}
.portrait.p-ouluo::after{content:'👨‍🏫';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px}
.portrait.p-linche{background:linear-gradient(135deg,#1a4a4a,#2a7a7a);box-shadow:0 0 15px rgba(57,210,192,.3)}
.portrait.p-linche::after{content:'🧑‍💻';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px}
.portrait.p-aye{background:linear-gradient(135deg,#4a2a1a,#7a4a2a);box-shadow:0 0 15px rgba(210,153,27,.3)}
.portrait.p-aye::after{content:'👩‍💼';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px}
.portrait.p-lixia{background:linear-gradient(135deg,#3a1a5a,#6a2a9a);box-shadow:0 0 15px rgba(188,140,255,.3)}
.portrait.p-lixia::after{content:'👩';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px}
.portrait.p-keke{background:linear-gradient(135deg,#4a4a4a,#8a8a8a);box-shadow:0 0 15px rgba(200,200,200,.3)}
.portrait.p-keke::after{content:'🐕';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:26px}
.portrait.p-hermo{background:linear-gradient(135deg,#1a1a1a,#3a3a00);box-shadow:0 0 15px rgba(240,192,96,.2)}
.portrait.p-hermo::after{content:'👤';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px}
.portrait.p-saiyin{background:linear-gradient(135deg,#0a1a3a,#1a3a6a);box-shadow:0 0 15px rgba(100,160,255,.3)}
.portrait.p-saiyin::after{content:'👨‍⚖️';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px}

/* Dialog */
#dialog-overlay{position:absolute;bottom:0;left:0;right:0;top:0;display:none;z-index:30;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
#dialog-box{width:94%;max-width:660px;background:rgba(13,17,23,.97);border:1px solid var(--border);border-radius:18px 18px 0 0;padding:18px 22px;animation:fadeUp .3s ease;box-shadow:0 -4px 30px rgba(0,0,0,.6);max-height:70vh;overflow-y:auto}
#dialog-box .d-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#dialog-box .d-speaker{font-size:13px;color:var(--gold);font-weight:700}
#dialog-box .d-text{font-size:15px;line-height:1.75;margin:4px 0 14px;color:var(--text)}
#dialog-box .d-text .highlight{color:var(--gold);font-weight:600}
#dialog-box .d-choices{display:flex;gap:8px;flex-wrap:wrap}

/* CG overlay */
#cg-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:25;background:#000}
#cg-canvas{width:100%;height:100%}
#cg-text{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);color:#fff;font-size:18px;text-align:center;z-index:26;pointer-events:none;animation:cgFade 2s ease infinite;text-shadow:0 0 20px rgba(240,192,96,.6)}
#cg-skip{position:absolute;bottom:20px;right:20px;z-index:27;color:var(--text2);font-size:12px;cursor:pointer;background:rgba(0,0,0,.6);padding:6px 12px;border-radius:6px}

/* Level */
#level-ui{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column}
#level-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:rgba(0,0,0,.8);z-index:5}
#level-main{display:flex;flex:1;overflow:hidden}
#level-canvas-wrap{flex:1;position:relative;overflow:hidden;min-width:0}
#level-canvas-wrap canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1}
#level-panel{width:260px;background:var(--panel);border-left:1px solid var(--border);padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
#level-footer{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;background:rgba(0,0,0,.8);z-index:5}

.evidence-card{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:12px;transition:all .2s;display:flex;align-items:center;gap:7px}
.evidence-card:hover{border-color:var(--blue);background:#1a2030}.evidence-card.selected{border-color:var(--gold)!important;background:#1a1a2e!important;animation:glow 1.5s infinite}
.chain-slot{min-height:48px;border:2px dashed var(--border);border-radius:10px;padding:7px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;transition:all .3s}
.chain-slot.highlight{border-color:var(--gold)!important;background:rgba(240,192,96,.05)}.chain-slot .slot-label{color:var(--text2);font-size:10px}
.chain-step{background:linear-gradient(135deg,var(--accent),#553098);color:#fff;padding:6px 10px;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:5px;animation:slideIn .3s ease}
.chain-step .remove{cursor:pointer;opacity:.6}.chain-step .remove:hover{opacity:1}
.param-slider{margin-bottom:2px}.param-slider label{font-size:10px;color:var(--text2);display:flex;justify-content:space-between}
.param-slider input[type=range]{width:100%;accent-color:var(--accent);height:6px}
.param-display{background:var(--card);border-radius:8px;padding:8px;text-align:center;font-size:16px;font-weight:700;color:var(--cyan);font-family:'Consolas',monospace}
.hint-box{background:rgba(210,153,27,.1);border:1px solid var(--warn);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--warn);animation:fadeIn .3s ease}

.overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.82);display:none;z-index:40;align-items:center;justify-content:center}
.overlay-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px 32px;text-align:center;max-width:400px;width:90%;animation:fadeUp .4s ease;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.overlay-card h2{font-size:19px;margin-bottom:10px}.overlay-card .stars-display{font-size:40px;margin:10px 0}.overlay-card .star{display:inline-block;animation:starPop .5s ease backwards}.overlay-card .feedback{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:10px}.overlay-card .mastery-change{font-size:12px;color:var(--green);margin-bottom:14px}.overlay-card .error-type{display:inline-block;padding:3px 9px;border-radius:10px;font-size:10px;background:rgba(248,81,73,.15);color:var(--red);margin-bottom:8px}

.chapter-intro-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;z-index:35;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.chapter-intro-overlay .ci-char{font-size:70px;margin-bottom:10px}.chapter-intro-overlay .ci-title{font-size:24px;color:var(--gold);margin:8px 0}.chapter-intro-overlay .ci-sub{font-size:14px;color:var(--text2);max-width:500px;line-height:1.7;margin-bottom:14px}.chapter-intro-overlay .ci-info{font-size:11px;color:var(--text2);margin-bottom:4px}

.achievement-toast{position:fixed;top:55px;right:14px;z-index:50;background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:10px 14px;animation:slideIn .4s ease,fadeOut2 .5s 2.5s ease forwards;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:280px}
@keyframes fadeOut2{to{opacity:0;transform:translateX(40px)}}
.achievement-toast .ach-icon{font-size:28px}.achievement-toast .ach-title{font-size:12px;font-weight:700;color:var(--gold)}.achievement-toast .ach-desc{font-size:10px;color:var(--text2)}

.full-panel{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;z-index:35;overflow-y:auto;padding:50px 16px 80px}
.full-panel .panel-inner{max-width:680px;margin:0 auto}.full-panel h2{text-align:center;color:var(--gold);margin-bottom:18px;font-size:20px}
.knowledge-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;transition:all .2s}.knowledge-item:hover{border-color:var(--accent)}
.knowledge-item .k-bar{flex:1;max-width:100px;height:7px;background:var(--border);border-radius:3px;overflow:hidden}.knowledge-item .k-bar-fill{height:100%;border-radius:3px;transition:width .5s}

.story-scene{position:absolute;top:0;left:0;width:100%;height:100%;display:none;z-index:28;align-items:center;justify-content:center}
.story-scene .scene-bg{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:.4}
.story-scene .scene-content{position:relative;z-index:1;text-align:center;max-width:600px;padding:30px}
.story-scene .scene-title{font-size:28px;color:var(--gold);margin-bottom:12px;animation:fadeUp .6s ease}
.story-scene .scene-text{font-size:16px;color:var(--text);line-height:2;animation:fadeUp .6s .2s ease backwards}
.story-scene .scene-chars{display:flex;gap:20px;justify-content:center;margin:20px 0;animation:fadeUp .6s .3s ease backwards}

@media(max-width:768px){#level-main{flex-direction:column}#level-canvas-wrap{flex:none;height:260px}#level-panel{width:100%;max-height:180px;flex-direction:row;flex-wrap:wrap;gap:5px;overflow-y:auto}#chapter-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.chapter-card{padding:12px 8px}#home-ui .hero h1{font-size:24px}.portrait.lg{width:60px;height:60px}.portrait.xl{width:80px;height:80px}}
</style>
</head>
<body>
<div id="game">
<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
<div id="top-bar"><div class="title">🔍 数学侦探<span style="font-weight:400;font-size:12px;color:var(--text2)">失落定理</span></div><div class="info"><span>⭐<b id="total-stars">0</b></span><span>💎<b id="total-dust">0</b></span><span>🏆<b id="total-ach">0</b></span><div class="mastery-ring" id="mastery-ring">0%</div></div></div>

<div id="home-ui">
<div class="hero"><h1>数学侦探：失落定理</h1><div class="sub">数学之城陷入危机，定理晶核裂开了……</div><button class="btn btn-gold" onclick="Game.continueOrStart()" style="font-size:15px;padding:10px 24px">▶ 开始调查</button><button class="btn btn-outline btn-sm" onclick="Game.quickLevel()" style="margin-left:6px">⚡快速挑战</button></div>
<div id="chapter-scroll"><div id="chapter-grid"></div></div>
<div class="bottom-nav"><div class="nav-btn" onclick="Game.showPage('home')"><span class="nav-icon">🏠</span>主城</div><div class="nav-btn" onclick="Game.showMistakes()"><span class="nav-icon">📋</span>错题<span class="nav-badge" id="mistake-count">0</span></div><div class="nav-btn" onclick="Game.showAchievements()"><span class="nav-icon">🏆</span>成就</div><div class="nav-btn" onclick="Game.showKnowledge()"><span class="nav-icon">📖</span>图鉴</div><div class="nav-btn" onclick="Game.showPage('home')"><span class="nav-icon">🎒</span>装备</div><div class="nav-btn" onclick="Game.resetProgress()"><span class="nav-icon">⚙️</span>设置</div></div></div>

<div id="dialog-overlay" onclick="Game.advanceDialog(event)"><div id="dialog-box"></div></div>

<div id="cg-overlay"><canvas id="cg-canvas"></canvas><div id="cg-text"></div><div id="cg-skip" onclick="Game.skipCG()">跳过 ⏭</div></div>

<div id="level-ui"><div id="level-header"><span class="lvl-name" id="lvl-name"></span><span class="lvl-obj" id="lvl-obj"></span><button class="btn btn-outline btn-sm" onclick="Game.exitLevel()">✕</button></div><div id="level-main"><div id="level-canvas-wrap"></div><div id="level-panel"></div></div><div id="level-footer"><button class="btn btn-outline btn-sm" id="hint-btn" onclick="Game.useHint()">💡提示</button><button class="btn btn-outline btn-sm" id="math-eye-btn" onclick="Game.toggleMathEye()">👁数学之眼</button><button class="btn btn-outline btn-sm" onclick="Game.resetLevel()">🔄重置</button><button class="btn btn-primary" id="submit-btn" onclick="Game.submitLevel()">✓提交</button></div></div>

<div class="overlay" id="result-overlay"><div class="overlay-card"><h2 id="result-title"></h2><div class="stars-display" id="result-stars"></div><div class="error-type" id="result-error-type" style="display:none"></div><p class="feedback" id="result-feedback"></p><p class="mastery-change" id="result-mastery"></p><div style="display:flex;gap:8px;justify-content:center"><button class="btn btn-gold" onclick="Game.closeResult()">继续调查</button><button class="btn btn-outline btn-sm" id="retry-btn" onclick="Game.retryLevel()" style="display:none">🔄重试</button></div></div></div>

<div class="chapter-intro-overlay" id="chapter-intro"><div class="ci-char" id="ci-char"></div><div class="ci-title" id="ci-title"></div><div class="ci-sub" id="ci-sub"></div><div class="ci-info" id="ci-info"></div><button class="btn btn-gold" onclick="Game.closeChapterIntro()">进入章节</button><button class="btn btn-outline btn-sm" onclick="Game.skipToHome()" style="margin-top:4px">返回主城</button></div>

<div class="full-panel" id="knowledge-panel"><div class="panel-inner"><h2>📖 知识图鉴</h2><div id="knowledge-tree"></div><div style="text-align:center;margin-top:14px"><button class="btn btn-outline" onclick="document.getElementById('knowledge-panel').style.display='none'">关闭</button></div></div></div>
<div class="full-panel" id="mistakes-panel"><div class="panel-inner"><h2>📋 错题回廊</h2><p id="no-mistakes-msg" style="text-align:center;color:var(--text2)">暂无错题记录</p><div id="mistakes-list"></div><div style="text-align:center;margin-top:14px"><button class="btn btn-outline" onclick="document.getElementById('mistakes-panel').style.display='none'">关闭</button></div></div></div>
<div class="full-panel" id="achievements-panel"><div class="panel-inner"><h2>🏆 成就</h2><div id="achievements-list"></div><div style="text-align:center;margin-top:14px"><button class="btn btn-outline" onclick="document.getElementById('achievements-panel').style.display='none'">关闭</button></div></div></div>
<div id="toast-container" style="position:fixed;top:55px;right:14px;z-index:50;display:flex;flex-direction:column;gap:6px"></div>
</div></div>
<script>
// ==================== 音效系统 ====================

// ===== CG动画系统 =====
async playCG(type){
  const def=CG_SCENES[type];if(!def)return;
  this.cgRunning=true;document.getElementById('cg-overlay').style.display='block';
  const canvas=document.getElementById('cg-canvas');canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
  const textEl=document.getElementById('cg-text');textEl.textContent='';
  const start=Date.now(),dur=def.duration;
  return new Promise(resolve=>{
    this.cgResolve=resolve;
    const frame=()=>{
      if(!this.cgRunning){this.endCG(resolve);return}
      const elapsed=Date.now()-start,progress=Math.min(elapsed/dur,1);
      ctx.clearRect(0,0,w,h);
      if(type==='rainy_desk')this.drawCG_RainyDesk(ctx,w,h,progress);
      else if(type==='evidence_return')this.drawCG_EvidenceReturn(ctx,w,h,progress);
      else if(type==='star_sky')this.drawCG_StarSky(ctx,w,h,progress);
      if(progress<1){requestAnimationFrame(frame)}else{setTimeout(()=>this.endCG(resolve),500)}
    };
    requestAnimationFrame(frame);
  });
},

drawCG_RainyDesk(ctx,w,h,p){
  // Phase 1: Dark desk with rain (p 0-0.3)
  // Phase 2: Triangle begins to glow (p 0.3-0.5)
  // Phase 3: City entrance appears (p 0.5-0.8)
  // Phase 4: Fade to white (p 0.8-1.0)
  const f=Math.min(p/0.8,1);
  ctx.fillStyle='#050510';ctx.fillRect(0,0,w,h);
  // Rain
  ctx.strokeStyle='rgba(150,180,220,'+(0.5-f*0.3)+')';ctx.lineWidth=1;
  const rainSeed=42;
  for(let i=0;i<60;i++){
    const rx=((i*137+rainSeed)%w),ry=((i*251+rainSeed*3+Date.now()*0.02)%h);
    ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+15);ctx.stroke();
  }
  // Desk
  const deskY=h*0.62;ctx.fillStyle='#1a1410';ctx.fillRect(0,deskY,w,h-deskY);
  ctx.fillStyle='#2a2018';ctx.fillRect(w*0.2,deskY,w*0.6,4);
  // Paper
  if(p>0.1){
    const alpha=Math.min((p-0.1)/0.3,1);ctx.fillStyle='rgba(240,235,220,'+alpha+')';
    const px=w*0.25,py=deskY-80,pw=w*0.5,ph=120;
    ctx.fillRect(px,py,pw,ph);ctx.fillStyle='rgba(200,195,180,'+alpha+')';ctx.fillRect(px+20,py+20,pw-40,1);ctx.fillRect(px+20,py+40,pw-40,1);
    // Triangle on paper
    if(p>0.25){
      const ta=Math.min((p-0.25)/0.2,1);ctx.strokeStyle='rgba(30,30,30,'+ta+')';ctx.lineWidth=2+ta;
      const cx=w*0.5,cy=deskY-35;ctx.beginPath();ctx.moveTo(cx,cy-25);ctx.lineTo(cx-35,cy+20);ctx.lineTo(cx+35,cy+20);ctx.closePath();ctx.stroke();
      if(p>0.35){

// Function slider
renderFunctionSlider(lvl,panel){const isQuad=lvl.funcType==='quadratic',isInv=lvl.funcType==='inverse';panel.innerHTML='<div style="font-weight:700;font-size:12px;color:var(--gold)">🎛️ 参数调节</div><div id="slider-panel"></div><div class="param-display" id="func-display"></div>';const sp=document.getElementById('slider-panel');if(isQuad){sp.innerHTML='<div class="param-slider"><label>a(开口)<span id="val-a">'+this.sliderValues.a.toFixed(1)+'</span></label><input type="range" min="-3" max="3" step="0.1" value="'+this.sliderValues.a+'" oninput="Game.onSlider(\'a\',this.value)"></div><div class="param-slider"><label>h(左右)<span id="val-h">'+this.sliderValues.h.toFixed(1)+'</span></label><input type="range" min="-5" max="5" step="0.5" value="'+this.sliderValues.h+'" oninput="Game.onSlider(\'h\',this.value)"></div><div class="param-slider"><label>k(上下)<span id="val-k">'+this.sliderValues.k.toFixed(1)+'</span></label><input type="range" min="-5" max="5" step="0.5" value="'+this.sliderValues.k+'" oninput="Game.onSlider(\'k\',this.value)"></div>'}else if(isInv){sp.innerHTML='<div class="param-slider"><label>k(系数)<span id="val-kv">'+this.sliderValues.kv.toFixed(1)+'</span></label><input type="range" min="-8" max="8" step="0.5" value="'+this.sliderValues.kv+'" oninput="Game.onSlider(\'kv\',this.value)"></div>'}else{sp.innerHTML='<div class="param-slider"><label>k(斜率)<span id="val-k">'+this.sliderValues.k.toFixed(1)+'</span></label><input type="range" min="-4" max="4" step="0.1" value="'+this.sliderValues.k+'" oninput="Game.onSlider(\'k\',this.value)"></div><div class="param-slider"><label>b(截距)<span id="val-b">'+this.sliderValues.b.toFixed(1)+'</span></label><input type="range" min="-6" max="6" step="0.5" value="'+this.sliderValues.b+'" oninput="Game.onSlider(\'b\',this.value)"></div>'}setTimeout(()=>this.drawFunctionCanvas(lvl),100)},
onSlider(param,value){const v=parseFloat(value);this.sliderValues[param]=v;const el=document.getElementById('val-'+param);if(el)el.textContent=v.toFixed(1);this.updateFuncDisplay(this.currentLevel.funcType);this.drawFunctionCanvas(this.currentLevel);Sound.slide()},
updateFuncDisplay(type){const d=document.getElementById('func-display'),sv=this.sliderValues;if(type==='quadratic'){const h=sv.h,k=sv.k,a=sv.a,hs=h>=0?'-'+Math.abs(h):'+'+Math.abs(h),ks=k>=0?'+'+k.toFixed(1):'-'+Math.abs(k).toFixed(1);d.textContent='y='+a.toFixed(1)+'(x'+hs+')²'+ks}else if(type==='inverse'){d.textContent='y='+sv.kv.toFixed(1)+'/x'}else{const s=sv.b>=0?'+':'-';d.textContent='y='+sv.k.toFixed(1)+'x'+s+Math.abs(sv.b).toFixed(1)}},
drawFunctionCanvas(lvl){const wrap=document.getElementById('level-canvas-wrap');const canvas=document.getElementById('levelCanvas');if(!canvas)return;canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;ctx.fillStyle='#06080f';ctx.fillRect(0,0,w,h);const ox=w/2,oy=h/2,scale=42;ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;for(let x=ox%scale;x<w;x+=scale){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=oy%scale;y<h;y+=scale){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(w,oy);ctx.stroke();ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,h);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(w-10,oy);ctx.lineTo(w-20,oy-6);ctx.lineTo(w-20,oy+6);ctx.fill();ctx.beginPath();ctx.moveTo(ox,10);ctx.lineTo(ox-6,20);ctx.lineTo(ox+6,20);ctx.fill();ctx.fillText('x',w-18,oy-10);ctx.fillText('y',ox+10,18);ctx.fillStyle='#8b949e';ctx.font='10px "Noto Sans SC"';for(let i=-8;i<=8;i++){if(i===0)continue;ctx.fillText(i,ox+i*scale-8,oy+16);ctx.fillText(i,ox-20,oy-i*scale+4)}ctx.fillText('O',ox-14,oy+15);const targets=lvl.targets||[];for(const t of targets){const tx=ox+t.x*scale,ty=oy-t.y*scale;ctx.fillStyle='#f0c060';ctx.beginPath();ctx.arc(tx,ty,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f0c060';ctx.lineWidth=2;ctx.beginPath();ctx.arc(tx,ty,15,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#000';ctx.font='bold 11px "Noto Sans SC"';ctx.fillText('⭐',tx-9,ty+5);ctx.fillStyle='#f0c060';ctx.fillText('('+t.x+','+t.y+')',tx+16,ty-2)}const sv=this.sliderValues,isQuad=lvl.funcType==='quadratic',isInv=lvl.funcType==='inverse';ctx.strokeStyle='#58a6ff';ctx.lineWidth=3;ctx.beginPath();let started=false;for(let px=0;px<w;px+=1){const xVal=(px-ox)/scale;let yVal;if(isQuad)yVal=sv.a*Math.pow(xVal-sv.h,2)+sv.k;else if(isInv)yVal=xVal===0?NaN:sv.kv/xVal;else yVal=sv.k*xVal+sv.b;if(isNaN(yVal)||Math.abs(yVal)>10){started=false;continue}const py=oy-yVal*scale;if(!started){ctx.moveTo(px,py);started=true}else ctx.lineTo(px,py)}ctx.stroke();if(this.mathEye&&targets.length>0){ctx.fillStyle='rgba(240,192,96,.12)';for(const t of targets){ctx.beginPath();ctx.arc(ox+t.x*scale,oy-t.y*scale,22,0,Math.PI*2);ctx.fill()}}},

// Pattern match
renderPatternMatch(lvl,panel){panel.innerHTML='<div style="font-weight:700;font-size:12px;color:var(--gold)">🔍 选择答案</div><div id="match-options" style="display:flex;flex-direction:column;gap:7px;margin-top:4px"></div>';this.matchAnswer=null;document.getElementById('match-options').innerHTML=(lvl.options||[]).map((o,i)=>'<div class="evidence-card" onclick="Game.selectMatch('+i+')" id="match-opt-'+i+'"><span style="font-size:15px">'+(o.icon||'📌')+'</span><span>'+o.text+'</span></div>').join('');setTimeout(()=>{const wrap=document.getElementById('level-canvas-wrap');const canvas=document.getElementById('levelCanvas');if(!canvas)return;canvas.width=wrap.clientWidth;canvas.height=wrap.clientHeight;const ctx=canvas.getContext('2d');ctx.fillStyle='#06080f';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#f0c060';ctx.font='bold 20px "Noto Sans SC"';ctx.textAlign='center';ctx.fillText(lvl.question||'',canvas.width/2,canvas.height/2-15);if(lvl.subtext){ctx.fillStyle='#8b949e';ctx.font='14px "Noto Sans SC"';ctx.fillText(lvl.subtext,canvas.width/2,canvas.height/2+25)}ctx.textAlign='start'},100)},
selectMatch(idx){document.querySelectorAll('#match-options .evidence-card').forEach(c=>c.classList.remove('selected'));document.getElementById('match-opt-'+idx).classList.add('selected');this.matchAnswer=idx;Sound.click()},

// Submit & validation (abbreviated - core logic same as before)
submitLevel(){if(this.state!=='level')return;const lvl=this.currentLevel;let correct=false,feedback='',errorType=null;if(lvl.type==='geometry_proof'){const r=this.validateProof(lvl);correct=r.correct;feedback=r.feedback;errorType=r.errorType}else if(lvl.type==='function_slider'){const r=this.validateSlider(lvl);correct=r.correct;feedback=r.feedback;errorType=r.errorType||'model_error'}else if(lvl.type==='pattern_match'){if(this.matchAnswer===null||this.matchAnswer===undefined){correct=false;feedback='请先选择一个答案再提交。';errorType='expression_gap'}else{correct=this.matchAnswer===lvl.correctIdx;feedback=correct?(lvl.successMsg||'正确！'):(lvl.failMsg||'不对，再检查条件。');if(!correct)errorType=lvl.errorType||'model_error'}}let stars=0;const elapsed=(Date.now()-this.levelStartTime)/1000;if(correct){stars=this.hintsUsed===0?3:(this.hintsUsed<=1?2:1);if(elapsed<25&&stars===3)this.progress.speedClears=(this.progress.speedClears||0)+1}if(correct){Sound.success();if(stars>=3)setTimeout(()=>Sound.star(),300)}else Sound.fail();if(correct&&this.hintsUsed===0){this.progress.currentNoHint=(this.progress.currentNoHint||0)+1;if(this.progress.currentNoHint>=(this.progress.noHintStreak||0))this.progress.noHintStreak=this.progress.currentNoHint}else if(!correct||this.hintsUsed>0)this.progress.currentNoHint=0;if(correct&&lvl.id&&lvl.id.includes('ssa'))this.progress.ssaCaught=(this.progress.ssaCaught||0)+1;if(correct&&lvl.type==='function_slider'&&lvl.funcType==='quadratic')this.progress.vertexStreak=(this.progress.vertexStreak||0)+1;else if(!correct&&lvl.type==='function_slider'&&lvl.funcType==='quadratic')this.progress.vertexStreak=0;document.getElementById('result-title').textContent=correct?'✨ 调查成功！':'🔍 需要重新调查';const starsHtml=[];for(let i=0;i<3;i++)starsHtml.push('<span class="star" style="animation-delay:'+(i*.15)+'s">'+(i<stars?'⭐':'☆')+'</span>');document.getElementById('result-stars').innerHTML=starsHtml.join('');document.getElementById('result-feedback').textContent=feedback;const errEl=document.getElementById('result-error-type');if(!correct&&errorType){errEl.style.display='inline-block';errEl.textContent='错因：'+(ERROR_LABELS[errorType]||errorType)}else errEl.style.display='none';document.getElementById('result-mastery').textContent='掌握度 '+(correct?'+':'')+(4+stars*3)+' · 星尘 '+(correct?'+'+stars*10:'+1');document.getElementById('retry-btn').style.display=correct?'none':'inline-block';document.getElementById('result-overlay').style.display='flex';if(!correct&&errorType){this.mistakes.push({level:lvl.name,chapter:CHAPTERS[this.currentChapter]?.name||'',errorType,timestamp:new Date().toLocaleString(),feedback,chapterId:this.currentChapter,levelIdx:this.currentLevelIdx})}if(correct){const chKey='ch'+this.currentChapter;if(!this.progress.mastery)this.progress.mastery={};if(!this.progress.mastery[chKey])this.progress.mastery[chKey]={stars:0,completed:0};const cm=this.progress.mastery[chKey];if(stars>cm.stars)cm.stars=stars;const lvlKey=chKey+'-'+this.currentLevelIdx;if(!this.progress.completedLevels)this.progress.completedLevels={};const prevStars=this.progress.completedLevels[lvlKey]||0;if(stars>prevStars)this.progress.completedLevels[lvlKey]=stars;if(!prevStars)cm.completed=(cm.completed||0)+1;this.progress.totalStars=(this.progress.totalStars||0)+Math.max(0,stars-prevStars);this.progress.dust=(this.progress.dust||0)+stars*10;if(stars>=3&&this.hintsUsed===0)this.progress.explanationCount=(this.progress.explanationCount||0)+1;if(this._retryingMistake){this.progress.mistakesFixed=(this.progress.mistakesFixed||0)+1;this._retryingMistake=false}}else{this.progress.dust=(this.progress.dust||0)+1}this.saveProgress();this.updateAllUI();this.checkAllAchievements()},

validateProof(lvl){const chain=this.proofChain||[],expected=lvl.expectedChain||[];if(chain.length===0)return{correct:false,feedback:'证明链为空。请选择证据卡构建推理过程。',errorType:'expression_gap'};if(chain.length!==expected.length){const missing=expected.filter(id=>!chain.find(c=>c.id===id));if(missing.length>0)return{correct:false,feedback:'证据链不完整。还需'+missing.length+'个关键步骤。检查所有已知条件是否都已使用。',errorType:'condition_missing'};return{correct:false,feedback:'证据链有多余步骤。精简推理，每一步都应有明确目的。',errorType:'model_error'}}let allMatch=true;for(let i=0;i<expected.length;i++){if(chain[i]?.id!==expected[i]){allMatch=false;break}}if(allMatch)return{correct:true,feedback:lvl.successMsg||'完美的证明链！每一步推理都有充分理由。'};for(let i=0;i<expected.length;i++){if(chain[i]?.id!==expected[i])return{correct:false,feedback:'第'+(i+1)+'步推理不正确。检查证明顺序：先确认已知条件，再用判定定理，最后得结论。',errorType:'correspondence_error'}}return{correct:false,feedback:'证明链顺序需要调整。',errorType:'expression_gap'}},

validateSlider(lvl){const sv=this.sliderValues,targets=lvl.targets||[];if(lvl.funcType==='quadratic'){const a=sv.a,h=sv.h,k=sv.k;let hitsAll=true;for(const t of targets){if(Math.abs(a*Math.pow(t.x-h,2)+k-t.y)>.12){hitsAll=false;break}}if(hitsAll)return{correct:true,feedback:lvl.successMsg||'完美！抛物线穿过所有目标点。'};return{correct:false,feedback:'抛物线未穿过所有目标。单独调整每个参数：a改变开口，h左右平移，k上下平移。',errorType:'model_error'}}else if(lvl.funcType==='inverse'){const kv=sv.kv;let hitsAll=true;for(const t of targets){if(Math.abs(t.x*t.y-kv)>.15){hitsAll=false;break}}if(hitsAll)return{correct:true,feedback:lvl.successMsg||'正确！k=x·y，反比例函数的核心秘密已被你掌握。'};return{correct:false,feedback:'k还未正确。反比例函数y=k/x中，k等于x与y的乘积。',errorType:'calculation_error'}}else{const k=sv.k,b=sv.b;let hitsAll=true;for(const t of targets){if(Math.abs(k*t.x+b-t.y)>.12){hitsAll=false;break}}if(hitsAll)return{correct:true,feedback:lvl.successMsg||'轨道完美对接！成功调试了斜率和截距。'};if(targets.length>=2){const t0=targets[0],t1=targets[1];const expK=(t1.y-t0.y)/(t1.x-t0.x),expB=t0.y-expK*t0.x;const kC=Math.abs(k-expK)<.15,bC=Math.abs(b-expB)<.2;if(!kC&&!bC)return{correct:false,feedback:'斜率k和截距b都需要调整。k=(y₂-y₁)/(x₂-x₁)。',errorType:'model_error'};if(!kC)return{correct:false,feedback:'斜率k不正确。期望约'+expK.toFixed(1)+'，当前'+k.toFixed(1)+'。',errorType:'calculation_error'};if(!bC)return{correct:false,feedback:'截距b不正确。期望约'+expB.toFixed(1)+'，当前'+b.toFixed(1)+'。',errorType:'calculation_error'}}return{correct:false,feedback:'继续调整参数。观察直线的倾斜程度和y轴交点。',errorType:'model_error'}}},

// Helpers
useHint(){if(this.state!=='level')return;this.hintsUsed++;this.hintLevel=Math.min(this.hintLevel+1,4);const lvl=this.currentLevel;const hints=lvl.hints||['仔细观察题目给出的已知条件。','可以试试数学之眼来发现隐藏的关系。','考虑这个知识点对应的定理或判定方法。','完整思路：从已知出发，逐步推导到结论。'];const box=document.createElement('div');box.className='hint-box';box.textContent='💡 Lv'+this.hintLevel+' '+hints[Math.min(this.hintLevel-1,hints.length-1)];document.getElementById('level-panel').appendChild(box);setTimeout(()=>box.remove(),5000);document.getElementById('hint-btn').textContent='💡提示('+this.hintsUsed+')';Sound.hint()},
toggleMathEye(){this.mathEye=!this.mathEye;if(this.mathEye)this.progress.mathEyeUses=(this.progress.mathEyeUses||0)+1;const btn=document.getElementById('math-eye-btn');btn.textContent=this.mathEye?'👁数学之眼(开)':'👁数学之眼';btn.style.borderColor=this.mathEye?'#f0c060':'';const lvl=this.currentLevel;if(lvl.type==='geometry_proof')this.drawGeometryCanvas(lvl);else if(lvl.type==='function_slider')this.drawFunctionCanvas(lvl);Sound.click()},
resetLevel(){this.proofChain=[];this.matchAnswer=null;this.selectedEvidence=null;const lvl=this.currentLevel;this.sliderValues={k:lvl.params?.k||0,b:lvl.params?.b||0,a:lvl.params?.a||1,h:lvl.params?.h||0,kv:lvl.params?.kv||1};this.mathEye=false;this.hintsUsed=0;this.hintLevel=0;document.getElementById('math-eye-btn').textContent='👁数学之眼';document.getElementById('math-eye-btn').style.borderColor='';document.getElementById('hint-btn').textContent='💡提示';this.renderLevel();Sound.click()},

async completeChapter(){
  const ch=CHAPTERS[this.currentChapter];document.getElementById('level-ui').style.display='none';this.state='home';this.showPage('home');
  await this.playCG('chapterClear');
  await this.playDialog(STORY.chapterComplete);

  if(this.currentChapter===6&&(this.progress.mastery?.ch6?.completed||0)>=4&&!this.storyFlags.completedGame){
    this.storyFlags.completedGame=true;

},

exitLevel(){document.getElementById('level-ui').style.display='none';document.getElementById('result-overlay').style.display='none';this.state='home';this.showPage('home');Sound.click()},

// Panels
showKnowledge(){document.getElementById('knowledge-panel').style.display='block';const tree=document.getElementById('knowledge-tree');const M=this.progress.mastery||{};const codeToCh={T1:2,T2:2,T3:2,T4:2,T5:2,T6:3,T7:3,T8:3,T9:3,T10:3,T11:4,T12:4,F0:1,F1:1,F2:1,F3:1,F4:1,F5:1,F6:1,F7:5,F8:5,F9:5,F10:6,F11:6,F12:6,F13:6,F14:6};const getM=(code)=>{const chId=codeToCh[code];if(chId===undefined)return 0;const key='ch'+chId;return(M[key]?.stars||0)*33};tree.innerHTML=KNOWLEDGE_TREE.map(k=>{const m=getM(k.code);return'<div class="knowledge-item"><div style="width:40px;height:40px;border-radius:50%;border:3px solid '+(m>55?'var(--green)':m>20?'var(--warn)':'var(--border)')+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px">'+m+'%</div><div style="flex:1"><div style="font-weight:600;font-size:13px">'+k.name+'<span style="font-size:9px;color:var(--text2);margin-left:4px">'+k.code+'</span></div><div style="font-size:10px;color:var(--text2)">'+k.desc+'</div></div><div style="font-size:9px;color:var(--text2);background:var(--panel);padding:2px 7px;border-radius:6px">'+k.group+'</div><div class="k-bar"><div class="k-bar-fill" style="width:'+m+'%;background:'+(m>55?'var(--green)':m>20?'var(--warn)':'var(--accent)')+'"></div></div></div>'}).join('')},
showMistakes(){document.getElementById('mistakes-panel').style.display='block';const list=document.getElementById('mistakes-list'),noMsg=document.getElementById('no-mistakes-msg');document.getElementById('mistake-count').textContent=this.mistakes.length;if(this.mistakes.length===0){noMsg.style.display='block';list.innerHTML='';return}noMsg.style.display='none';list.innerHTML=this.mistakes.slice().reverse().map((m,i)=>{const idx=this.mistakes.length-1-i;return'<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px"><div style="font-size:10px;color:var(--text2);margin-bottom:2px">'+m.chapter+' · '+m.timestamp+'</div><div style="font-weight:600;font-size:13px">'+m.level+'</div><div style="font-size:10px;color:var(--warn);margin:3px 0">错因：'+(ERROR_LABELS[m.errorType]||m.errorType)+'</div><div style="font-size:11px;color:var(--text2);margin-bottom:6px">'+m.feedback+'</div><button class="btn btn-outline btn-sm" onclick="Game.retryMistake('+idx+')">🔄重修此关</button></div>'}).join('')},

saveProgress(){try{const data={totalStars:this.progress.totalStars,dust:this.progress.dust,mastery:this.progress.mastery,completedLevels:this.progress.completedLevels,totalAchievements:this.progress.totalAchievements,noHintStreak:this.progress.noHintStreak,ssaCaught:this.progress.ssaCaught,vertexStreak:this.progress.vertexStreak,mistakesFixed:this.progress.mistakesFixed,explanationCount:this.progress.explanationCount,mathEyeUses:this.progress.mathEyeUses,speedClears:this.progress.speedClears,mistakes:this.mistakes.slice(-60),achievementsUnlocked:this.achievementsUnlocked,storyFlags:this.storyFlags};localStorage.setItem('md_ulti_progress',JSON.stringify(data))}catch(e){}},
